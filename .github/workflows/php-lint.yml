name: PHP lint
on:
  push:
    branches: [rebuild-clean]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: find app public -name "*.php" -print0 | xargs -0 -n1 php -l
